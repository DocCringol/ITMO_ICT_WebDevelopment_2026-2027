# PostgreSQL для локального запуска: docker compose up -d (или podman compose up -d).
# Логин, пароль и имя базы совпадают со значениями по умолчанию в settings.py.
services:
  db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_DB: conferences
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d conferences"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
