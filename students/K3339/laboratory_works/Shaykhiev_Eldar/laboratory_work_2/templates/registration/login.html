{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2 class="mb-3">Вход</h2>
        <form method="post" class="card card-body">
            {% csrf_token %}
            {% if form.errors %}<div class="alert alert-danger">Неверное имя пользователя или пароль</div>{% endif %}
            <div class="mb-3">
                <label class="form-label" for="id_username">Имя пользователя</label>
                <input class="form-control" type="text" name="username" id="id_username" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label" for="id_password">Пароль</label>
                <input class="form-control" type="password" name="password" id="id_password" required>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button class="btn btn-primary" type="submit">Войти</button>
        </form>
        <p class="mt-3">Нет аккаунта? <a href="{% url 'signup' %}">Зарегистрируйтесь</a></p>
    </div>
</div>
{% endblock %}
